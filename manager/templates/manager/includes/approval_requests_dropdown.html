<div id="approvalRequestsPanel">
    <header class="approval-panel__header">
        <div class="approval-panel__title-row">
            <h2 class="approval-panel__title">Approvals</h2>
            <span id="approvalRequestsPanelCount" class="approval-panel__count" data-count="0" aria-hidden="true"></span>
        </div>
        <p id="approvalRequestsPanelSummary" class="approval-panel__summary">Nothing pending review</p>
    </header>
    <div
        id="approvalRequestsFilterBar"
        class="approval-panel__filters approval-filter-scroll"
        role="toolbar"
        aria-label="Filter approval requests by type"
    >
        <div class="approval-filter-track">
            {% include 'mapping/includes/approval_filter_chips.html' %}
        </div>
    </div>
    <div id="approvalRequestsList" class="approval-panel__list"></div>
</div>
