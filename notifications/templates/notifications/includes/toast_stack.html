{% load static %}
<link rel="stylesheet" href="{% static 'notifications/css/notifications.css' %}">
<div
    id="geotrakToastStack"
    class="geotrak-toast-stack"
    style="--toast-stack-top: {{ toast_top|default:'5rem' }};"
    role="region"
    aria-label="Notifications"
></div>
<template id="geotrakToastTemplate">
    <div class="geotrak-toast" data-type="info" role="status" aria-live="polite" aria-atomic="true">
        <div class="geotrak-toast__main">
            <div class="geotrak-toast__icon-wrap" aria-hidden="true"></div>
            <div class="geotrak-toast__text">
                <p class="geotrak-toast__label geotrak-sr-only"></p>
                <p class="geotrak-toast__message"></p>
            </div>
            <button type="button" class="geotrak-toast__close" aria-label="Dismiss notification">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <div class="geotrak-toast__progress-track" hidden>
            <div class="geotrak-toast__progress-bar"></div>
        </div>
    </div>
</template>
<div
    id="geotrakConfirmDialog"
    class="geotrak-confirm"
    hidden
    aria-hidden="true"
>
    <div class="geotrak-confirm__backdrop" data-geotrak-confirm-dismiss tabindex="-1"></div>
    <div
        class="geotrak-confirm__panel"
        role="alertdialog"
        aria-modal="true"
        aria-labelledby="geotrakConfirmTitle"
        aria-describedby="geotrakConfirmMessage"
    >
        <h2 id="geotrakConfirmTitle" class="geotrak-confirm__title">Confirm</h2>
        <p id="geotrakConfirmMessage" class="geotrak-confirm__message"></p>
        <div class="geotrak-confirm__actions">
            <button type="button" class="geotrak-confirm__btn geotrak-confirm__btn--cancel" data-geotrak-confirm-cancel>
                Cancel
            </button>
            <button type="button" class="geotrak-confirm__btn geotrak-confirm__btn--confirm" data-geotrak-confirm-ok>
                Confirm
            </button>
        </div>
    </div>
</div>
