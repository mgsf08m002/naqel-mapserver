{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in - Naqel Maps</title>
    <link href="{% static 'css/output.css' %}" rel="stylesheet">
</head>
<body class="bg-white min-h-screen font-sans">
    <div class="flex min-h-screen">
        <!-- Left Column - Login Form -->
        <div class="flex-1 flex flex-col justify-center px-8 py-12 bg-white">
            <div class="mx-auto w-full max-w-sm">
                <!-- Login Form -->
                <div>
                    <h2 class="text-3xl font-bold text-black mb-2 animate-fade-in">Log in</h2>
                    <p class="text-black mb-8 animate-fade-in-delay">Welcome back! Please enter your details.</p>

                    <form id="loginForm" class="space-y-6">
                        {% csrf_token %}
                        
                        <!-- Email Field -->
                        <div class="animate-fade-in-delay-2">
                            <label for="email" class="block text-sm font-medium text-black mb-2">
                                Email
                            </label>
                            <input 
                                type="email" 
                                id="email" 
                                name="email" 
                                required
                                placeholder="Enter your email"
                                class="w-full px-4 py-3 border border-black rounded-full focus:ring-2 focus:ring-black focus:border-black outline-none transition"
                            >
                        </div>

                        <!-- Password Field -->
                        <div class="animate-fade-in-delay-3">
                            <label for="password" class="block text-sm font-medium text-black mb-2">
                                Password
                            </label>
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                required
                                placeholder="Enter your password"
                                class="w-full px-4 py-3 border border-black rounded-full focus:ring-2 focus:ring-black focus:border-black outline-none transition"
                            >
                        </div>

                        <!-- Forgot Password -->
                        <div class="flex items-center justify-end animate-fade-in-delay-4">
                            <a href="#" class="text-sm text-black hover:underline font-medium">
                                Forgot password?
                            </a>
                        </div>

                        <!-- Error Message -->
                        <div id="errorMessage" class="hidden text-sm text-black bg-gray-100 border border-black p-3 rounded-full"></div>

                        <!-- Sign In Button -->
                        <button 
                            type="submit"
                            class="w-full bg-black hover:bg-gray-900 text-white font-semibold py-3 px-4 rounded-full transition duration-200 focus:outline-none focus:ring-2 focus:ring-black focus:ring-offset-2 animate-fade-in-delay-5"
                        >
                            Sign in
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Right Column - Logo -->
        <div class="hidden lg:flex flex-1 bg-black p-12 flex-col justify-center items-center border-l border-black">
            <div class="flex items-center justify-center">
                <img src="{% static 'auth/images/logo.png' %}" alt="Logo" class="max-w-xs w-full h-auto">
            </div>
        </div>
    </div>

    <style>
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in {
            animation: fadeIn 0.6s ease-out forwards;
            opacity: 0;
        }
        .animate-fade-in-delay {
            animation: fadeIn 0.6s ease-out 0.2s forwards;
            opacity: 0;
        }
        .animate-fade-in-delay-2 {
            animation: fadeIn 0.6s ease-out 0.4s forwards;
            opacity: 0;
        }
        .animate-fade-in-delay-3 {
            animation: fadeIn 0.6s ease-out 0.6s forwards;
            opacity: 0;
        }
        .animate-fade-in-delay-4 {
            animation: fadeIn 0.6s ease-out 0.8s forwards;
            opacity: 0;
        }
        .animate-fade-in-delay-5 {
            animation: fadeIn 0.6s ease-out 1s forwards;
            opacity: 0;
        }
    </style>
    <!-- Notification Container -->
    <div id="notificationContainer" class="fixed top-20 left-1/2 z-50 space-y-3 w-auto max-w-md"></div>
    
    <!-- Notification Template -->
    <template id="notificationTemplate">
        <div class="notification-item bg-white border-2 border-black rounded-full px-6 py-4 shadow-lg flex items-center justify-between opacity-0 transform -translate-y-full transition-all duration-300 w-full">
            <div class="flex items-center space-x-3 flex-1">
                <div class="notification-icon flex-shrink-0"></div>
                <p class="notification-message text-sm font-medium text-black flex-1"></p>
            </div>
            <button class="notification-close ml-4 text-black hover:text-gray-600 transition flex-shrink-0" aria-label="Close">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
    </template>
    
    <style>
        #notificationContainer {
            transform: translateX(-50%);
            pointer-events: none;
        }
        #notificationContainer > * {
            pointer-events: auto;
        }
        .notification-item {
            min-width: 320px;
            max-width: 500px;
            width: 100%;
        }
        .notification-item.show {
            opacity: 1;
            transform: translateY(0);
        }
        .notification-item.hide {
            opacity: 0;
            transform: translateY(-100%);
        }
        @media (max-width: 640px) {
            #notificationContainer {
                top: 1rem;
                left: 1rem;
                right: 1rem;
                transform: none;
                max-width: 100%;
            }
        }
    </style>
    
    <script src="{% static 'notifications/js/notifications.js' %}"></script>
    <script>
        // Load Django messages as notifications
        document.addEventListener('DOMContentLoaded', function() {
            function showDjangoNotifications() {
                if (window.notify) {
                    const messages = [
                        {% for message in messages %}
                        {
                            message: "{{ message|escapejs }}",
                            type: '{% if message.tags == "error" %}error{% elif message.tags == "warning" %}warning{% elif message.tags == "success" %}success{% else %}info{% endif %}'
                        }{% if not forloop.last %},{% endif %}
                        {% endfor %}
                    ];
                    if (messages.length > 0) {
                        messages.forEach(function(msg) {
                            window.notify.show(msg.message, msg.type, 7000);
                        });
                    }

                    const params = new URLSearchParams(window.location.search);
                    if (params.get('email_changed') === '1') {
                        window.notify.info('System admin email changed. Please log in with the new email.');
                    }
                    if (params.get('password_changed') === '1') {
                        window.notify.info('Password updated. Please log in again.');
                    }
                    if (params.get('no_permission') === '1') {
                        const permissionType = params.get('permission_type');
                        let message = 'You do not have permission to access this page.';
                        if (permissionType === 'dashboard') {
                            message = 'You do not have permission to access this feature. Please contact your system administrator.';
                        } else if (permissionType === 'account_information') {
                            message = 'You do not have permission to access account information. Please contact your system administrator.';
                        } else if (permissionType === 'security') {
                            message = 'You do not have permission to access security settings. Please contact your system administrator.';
                        }
                        window.notify.error(message);
                    }
                } else {
                    setTimeout(showDjangoNotifications, 50);
                }
            }
            showDjangoNotifications();
        });
    </script>
    <script src="{% static 'auth/js/login.js' %}"></script>
</body>
</html>
