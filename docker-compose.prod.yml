# Production overrides for VPS (139.162.60.105).
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  pgadmin:
    ports: !reset
      - "127.0.0.1:5050:80"

  geotrak_maps:
    ports: !reset
      - "8000:8000"
    volumes: !reset
      - ./database:/database
    restart: unless-stopped
