<section class="lu-details">
  <h2 class="lu-details__head">Detected layer</h2>
  <dl class="lu-details__list">
    <div class="lu-details__row">
      <dt class="lu-details__label">Layer name</dt>
      <dd class="lu-details__value">{{ name }}</dd>
    </div>
    <div class="lu-details__row">
      <dt class="lu-details__label">Features</dt>
      <dd class="lu-details__value">{{ count }}</dd>
    </div>
    <div class="lu-details__row">
      <dt class="lu-details__label">CRS</dt>
      <dd class="lu-details__value">{{ crs_name }}</dd>
    </div>
    <div class="lu-details__row">
      <dt class="lu-details__label">SRID</dt>
      <dd class="lu-details__value">{{ epsg }}</dd>
    </div>
  </dl>
</section>
