<div class="mt-10 flex flex-wrap items-center gap-6 border-t border-gray-100 pt-8">
  <button
    type="submit"
    class="inline-flex items-center justify-center bg-gray-900 px-6 py-2.5 text-sm font-medium text-white transition hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-gray-300 focus:ring-offset-2"
  >
    {{ submit_label }}
  </button>
  {% if secondary_url %}
  <a href="{{ secondary_url }}" class="text-sm text-gray-400 transition hover:text-gray-900">{{ secondary_label }}</a>
  {% endif %}
</div>
