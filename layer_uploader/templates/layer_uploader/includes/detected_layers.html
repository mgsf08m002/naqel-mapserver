<section class="lu-detected">
  <div class="lu-detected__head">
    <div>
      <h2 class="lu-detected__title">Detected layers</h2>
      <p class="lu-detected__sub">Choose one layer to continue.</p>
    </div>
    <span class="lu-detected__count">{{ shapefiles|length }} found</span>
  </div>

  <form method="post" class="lu-detected__form">
    {% csrf_token %}
    <div class="lu-detected__list">
      {% for shp in shapefiles %}
      <label class="lu-layer-option">
        <input
          type="radio"
          name="selected"
          value="{{ shp.name }}"
          required
          class="lu-layer-option__input"
        >
        <span class="lu-layer-option__row">
          <span class="lu-layer-option__radio" aria-hidden="true"></span>
          <span class="lu-layer-option__content">
            <span class="lu-layer-option__top">
              <span class="lu-layer-option__name">{{ shp.name }}</span>
              {% if shp.error %}
              <span class="lu-layer-option__badge lu-layer-option__badge--error">Invalid</span>
              {% else %}
              <span class="lu-layer-option__badge">Ready</span>
              {% endif %}
            </span>
            {% if shp.error %}
            <span class="lu-layer-option__error">{{ shp.error }}</span>
            {% else %}
            <span class="lu-layer-option__meta">
              <span>{{ shp.crs_name }}</span>
              <span class="lu-layer-option__dot" aria-hidden="true">·</span>
              <span>SRID {{ shp.epsg }}</span>
              <span class="lu-layer-option__dot" aria-hidden="true">·</span>
              <span>{{ shp.count }} features</span>
            </span>
            {% endif %}
          </span>
        </span>
      </label>
      {% endfor %}
    </div>

    {% include 'layer_uploader/includes/flow_actions.html' with submit_label='Continue' secondary_url=upload_reset_url secondary_label='Start over' %}
  </form>
</section>
