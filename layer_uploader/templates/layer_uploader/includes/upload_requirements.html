<section class="lu-tips" aria-labelledby="upload-requirements">
  <h2 id="upload-requirements" class="lu-tips__title">Before you upload</h2>
  <ul class="lu-tips__list">
    <li class="lu-tips__item">
      <span class="lu-tips__num" aria-hidden="true">1</span>
      <p class="lu-tips__text">Use matching base names for <strong>.shp</strong>, <strong>.shx</strong>, and <strong>.dbf</strong>.</p>
    </li>
    <li class="lu-tips__item">
      <span class="lu-tips__num" aria-hidden="true">2</span>
      <p class="lu-tips__text">Include <strong>.prj</strong> when available for accurate CRS detection.</p>
    </li>
    <li class="lu-tips__item">
      <span class="lu-tips__num" aria-hidden="true">3</span>
      <p class="lu-tips__text">Confirm CRS and SRID on the next step after detection.</p>
    </li>
    <li class="lu-tips__item">
      <span class="lu-tips__num" aria-hidden="true">4</span>
      <p class="lu-tips__text">Zip archives are supported. Optional <strong>.prj</strong> improves coordinate detection.</p>
    </li>
  </ul>
</section>
