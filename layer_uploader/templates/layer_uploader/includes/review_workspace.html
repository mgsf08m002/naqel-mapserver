<div class="lr-workspace" aria-label="Layer review map and features">
  <div class="lr-workspace-map" id="lr-map-workspace">
    <div id="review-map" class="review-map-frame" role="application" aria-label="Feature map"></div>
    {% include 'mapping/includes/basemap_gallery.html' %}
    {% if review_large_layer %}
    <p class="lr-map-hint" aria-live="polite">Large layer — roads load for the current view.</p>
    {% endif %}
  </div>

  <aside id="lr-features-panel" class="lr-features-panel" aria-label="Features">
    <div class="lr-features-panel__body">
      <header class="lr-panel-header">
        <div class="lr-panel-head">
          <h2 class="lr-panel-title">Features</h2>
          <div class="lr-panel-head-actions">
            <span id="lr-feature-count" class="lr-panel-count">—</span>
            {% if not can_submit %}
            <a id="btn-finish" href="{% url 'success' %}?submitted=1" class="lr-btn-finish">Done</a>
            {% endif %}
          </div>
        </div>
        <div class="lr-panel-controls">
          <select id="lr-status-filter" class="lr-filter-select" aria-label="Filter by status">
            <option value="">All statuses</option>
            <option value="staged">New</option>
            <option value="nominated">Approved</option>
            <option value="rejected_upload">Rejected</option>
          </select>
          <div class="lr-bulk-actions">
            <button type="button" id="btn-bulk-approve" class="lr-bulk-btn lr-bulk-btn--approve">Approve all</button>
            <button type="button" id="btn-bulk-reject" class="lr-bulk-btn lr-bulk-btn--reject">Reject all</button>
          </div>
        </div>
        <div class="lr-panel-stats" aria-live="polite">
          <span class="lr-stat">Total <strong id="lr-cnt-total">—</strong></span>
          <span class="lr-stat lr-stat--staged">New <strong id="lr-cnt-staged">—</strong></span>
          <span class="lr-stat lr-stat--nominated">Approved <strong id="lr-cnt-nominated">—</strong></span>
          <span class="lr-stat lr-stat--rejected">Rejected <strong id="lr-cnt-rejected_upload">—</strong></span>
        </div>
      </header>
      <div id="lr-feature-list" class="lr-feature-list" role="list"></div>
      {% if can_submit %}
      <footer class="lr-panel-submit">
        <button type="button" id="btn-submit-manager" class="lr-btn-submit">
          {% if is_manager_uploader %}Publish layer{% else %}Submit layer{% endif %}
        </button>
      </footer>
      {% endif %}
    </div>
  </aside>
</div>
