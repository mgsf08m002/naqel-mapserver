<div class="lu-picker">
  <div id="lu-picker-empty" class="lu-dropzone" role="button" tabindex="0" aria-label="Choose shapefile files to upload">
    <svg class="lu-dropzone__graphic" width="40" height="40" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25" d="M12 16V4m0 0l-4 4m4-4l4 4M4 20h16"/>
    </svg>
    <p class="lu-dropzone__title">Drag and drop files here</p>
    <p class="lu-dropzone__hint">
      or
      <button type="button" id="lu-pick-files" class="lu-dropzone__link">browse from your computer</button>
    </p>
    <p class="lu-dropzone__formats">Accepts .shp, .shx, .dbf, .zip, and optional .prj</p>
  </div>

  <div id="lu-picker-filled" class="lu-picker-filled hidden" aria-live="polite">
    <div class="lu-selection">
      <div class="lu-selection__head">
        <div class="lu-selection__title-wrap">
          <span class="lu-selection__count" id="lu-file-count">0</span>
          <span class="lu-selection__title" id="lu-selection-title">Selected files</span>
        </div>
        <div class="lu-selection__tools">
          <button type="button" id="lu-add-more-files" class="lu-selection__tool">Add files</button>
          <button type="button" id="lu-clear-all" class="lu-selection__tool lu-selection__tool--muted">Clear all</button>
        </div>
      </div>
      <ul id="lu-file-list" class="lu-file-list"></ul>
    </div>
  </div>

  <input
    id="lu-file-input"
    class="lu-visually-hidden"
    type="file"
    name="files"
    multiple
    required
    accept=".shp,.shx,.dbf,.prj,.zip,.SHP,.SHX,.DBF,.PRJ,.ZIP"
  >
</div>
