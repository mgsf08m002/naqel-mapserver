{% load static %}
<!-- Basemap controls (bottom-left to avoid toolbar overlap) -->
<div id="basemapControls" class="absolute bottom-6 left-3 z-40 flex flex-col-reverse items-start gap-2">
    <button
        id="basemapGalleryToggle"
        type="button"
        class="inline-flex items-center justify-center w-8 h-8 rounded-full bg-white/95 backdrop-blur border border-gray-300 shadow-md hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
        title="Toggle base map"
        aria-label="Toggle base map"
        aria-expanded="true"
    >
        <span class="inline-block w-3.5 h-3.5 border border-gray-700 border-b-2 border-r-2 rounded-sm" aria-hidden="true"></span>
    </button>
    <div
        id="basemapGallery"
        class="flex flex-col gap-2 bg-white/95 backdrop-blur rounded-xl shadow-xl border border-gray-200 px-3 py-3 w-32"
    >
        <div class="mb-1">
            <span class="block text-xs font-semibold text-gray-700">Base map</span>
            <span class="block text-[10px] text-gray-400">Choose background</span>
        </div>
        <div class="flex flex-col gap-2 overflow-y-auto max-h-[320px] pr-1">
            <button
                type="button"
                data-basemap-id="esri-satellite"
                title="Satellite imagery"
                class="group relative border {% if maptiler_api_key %}border-transparent{% else %}border-blue-500{% endif %} rounded-lg overflow-hidden cursor-pointer opacity-80"
            >
                <img
                    src="{% static 'images/maps/satellite.png' %}"
                    alt="Satellite basemap"
                    class="block w-full h-16 object-cover pointer-events-none"
                />
                <span class="absolute bottom-1 left-1 right-1 rounded bg-black/60 px-1 py-0.5 text-[10px] font-semibold text-white text-center">Satellite</span>
            </button>

            {% if maptiler_api_key %}
            <button
                type="button"
                data-basemap-id="maptiler-streets"
                title="Streets"
                class="group relative border border-blue-500 rounded-lg overflow-hidden cursor-pointer opacity-80 hover:opacity-100 hover:border-blue-300"
            >
                <img
                    src="{% static 'images/maps/street.png' %}"
                    alt="Streets basemap"
                    class="block w-full h-16 object-cover pointer-events-none"
                />
                <span class="absolute bottom-1 left-1 right-1 rounded bg-black/60 px-1 py-0.5 text-[10px] font-semibold text-white text-center">Streets</span>
            </button>

            <button
                type="button"
                data-basemap-id="maptiler-outdoor"
                title="Outdoor"
                class="group relative border border-transparent rounded-lg overflow-hidden cursor-pointer opacity-80 hover:opacity-100 hover:border-blue-300"
            >
                <img
                    src="{% static 'images/maps/base.png' %}"
                    alt="Outdoor basemap"
                    class="block w-full h-16 object-cover pointer-events-none"
                />
                <span class="absolute bottom-1 left-1 right-1 rounded bg-black/60 px-1 py-0.5 text-[10px] font-semibold text-white text-center">Outdoor</span>
            </button>

            <button
                type="button"
                data-basemap-id="maptiler-dark"
                title="Dark"
                class="group relative border border-transparent rounded-lg overflow-hidden cursor-pointer opacity-80 hover:opacity-100 hover:border-blue-300"
            >
                <img
                    src="{% static 'images/maps/dark.png' %}"
                    alt="Dark basemap"
                    class="block w-full h-16 object-cover pointer-events-none"
                />
                <span class="absolute bottom-1 left-1 right-1 rounded bg-black/60 px-1 py-0.5 text-[10px] font-semibold text-white text-center">Dark</span>
            </button>
            {% endif %}
        </div>
    </div>
</div>
