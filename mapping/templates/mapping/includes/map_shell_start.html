{# Opens #mapPageShell, sidebar, expand tab, and #mapContainer — close with map_shell_end.html #}
<div id="mapPageShell" class="w-full h-full relative min-h-0">
    <div
        id="mapSidePanelBackdrop"
        class="hidden fixed inset-0 z-[49] bg-geotrak/40 backdrop-blur-[1px]"
        aria-hidden="true"
    ></div>
    <aside
        id="editSidePanel"
        class="map-sidebar-root msp-root absolute left-0 top-0 bottom-0 z-50 flex flex-col min-h-0 min-w-0 -translate-x-full transition-transform duration-300 ease-out antialiased"
        role="complementary"
        aria-label="{{ ui.map_details_aria }}"
    >
        <div class="msp-chrome shrink-0">
            <div class="msp-chrome__text">
                <h1 class="msp-chrome__title">{{ ui.details }}</h1>
            </div>
            <button
                type="button"
                id="sidePanelCollapseBtn"
                class="hidden msp-icon-btn"
                title="{{ ui.hide_panel }}"
                aria-label="{{ ui.hide_panel }}"
                aria-expanded="true"
                aria-controls="editSidePanel"
            >
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
            </button>
        </div>
        <div id="sidePanelInner" class="msp-body flex flex-col flex-1 min-h-0 min-w-0">
            <div class="msp-picker shrink-0">
                <p class="msp-eyebrow">{{ ui.choose_a_type }}</p>
                <h2 class="msp-picker__title">{{ ui.feature_type }}</h2>
                <p class="msp-picker__help">{{ ui.feature_type_help }}</p>
                <label for="featureSearch" class="msp-field__label">{{ ui.search }}</label>
                <input
                    type="text"
                    id="featureSearch"
                    placeholder="{{ ui.feature_search_placeholder }}"
                    class="msp-input"
                    autocomplete="off"
                >
            </div>
            <div id="sidePanelScrollArea" class="msp-scroll flex-1 min-h-0">
                <div id="sidePanelContent" class="msp-picker-list">
                    <div id="featureSearchResults" class="msp-empty">
                        <p>{{ ui.feature_search_empty }}</p>
                    </div>
                    <div id="linePanelContent" class="space-y-2" style="display: none;"></div>
                </div>
            </div>
        </div>
    </aside>
    <button
        type="button"
        id="sidePanelExpandTab"
        class="hidden fixed left-0 top-1/2 z-[52] -translate-y-1/2 rounded-r-xl border border-l-0 border-[#d7dee8] bg-white px-2.5 py-4 text-[11px] font-semibold uppercase tracking-wide text-[#0F2D53] shadow-md transition hover:bg-[#F3F6FA] focus:outline-none focus-visible:ring-2 focus-visible:ring-[#0F2D53]"
        aria-expanded="false"
        aria-controls="editSidePanel"
        title="{{ ui.show_details_panel }}"
        aria-label="{{ ui.show_details_panel }}"
    >
        {{ ui.details }}
    </button>
    <div id="mapContainer" class="w-full h-full relative min-h-0">
