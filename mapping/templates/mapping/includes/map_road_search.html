{% if request.user.is_authenticated %}
<div id="mapRoadSearch" class="map-road-search">
    <button
        type="button"
        id="mapRoadSearchToggle"
        class="map-road-search__toggle"
        title="{{ ui.road_search_toggle_title }}"
        aria-label="{{ ui.road_search_toggle_aria }}"
        aria-expanded="false"
        aria-controls="mapRoadSearchOverlay"
    >
        <svg class="map-road-search__icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M11 18a7 7 0 100-14 7 7 0 000 14z"></path>
        </svg>
    </button>
</div>
<div
    id="mapRoadSearchOverlay"
    class="map-road-search-overlay"
    aria-hidden="true"
>
    <div
        id="mapRoadSearchPanel"
        class="map-road-search__panel"
        role="search"
        aria-labelledby="mapRoadSearchHeading"
    >
        <p id="mapRoadSearchHeading" class="map-road-search__heading">{{ ui.road_search_heading }}</p>
        <label for="mapRoadSearchInput" class="sr-only">{{ ui.road_search_label }}</label>
        <div class="map-road-search__field">
            <svg class="map-road-search__field-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M11 18a7 7 0 100-14 7 7 0 000 14z"></path>
            </svg>
            <input
                type="search"
                id="mapRoadSearchInput"
                class="map-road-search__input"
                placeholder="{{ ui.road_search_placeholder }}"
                autocomplete="off"
                enterkeyhint="search"
                dir="auto"
            />
        </div>
        <p id="mapRoadSearchStatus" class="map-road-search__status is-empty" aria-live="polite"></p>
        <ul id="mapRoadSearchResults" class="map-road-search__results"></ul>
    </div>
</div>
{% endif %}
