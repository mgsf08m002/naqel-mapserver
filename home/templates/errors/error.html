{% load static %}
<!DOCTYPE html>
<html lang="{{ ui_language }}" dir="{{ ui_dir }}">
<head>
    {% include 'auth/includes/geotrak_favicon.html' %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>{{ error_doc_title }}</title>
    <link href="{% static 'css/output.css' %}" rel="stylesheet">
    <link href="{% static 'css/responsive.css' %}" rel="stylesheet">
    <link href="{% static 'auth/css/auth-shell.css' %}" rel="stylesheet">
    <link href="{% static 'auth/css/error-page.css' %}" rel="stylesheet">
</head>
<body class="font-sans">
    <div class="auth-shell error-page">
        <div class="auth-shell__lang">
            <nav class="ui-lang-switcher" aria-label="{{ ui.language }}">
                <form method="post" action="{% url 'set_ui_language' %}" class="ui-lang-switcher__form">
                    <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
                    <input type="hidden" name="next" value="{{ language_next }}">
                    <div class="ui-lang-switcher__track">
                        {% for lang in ui_languages %}
                        <button
                            type="submit"
                            name="language"
                            value="{{ lang.code }}"
                            class="ui-lang-switcher__btn{% if lang.active %} is-active{% endif %}"
                            {% if lang.active %}aria-current="true"{% endif %}
                            title="{{ lang.label }}"
                        >{{ lang.short }}</button>
                        {% endfor %}
                    </div>
                </form>
            </nav>
        </div>

        <div class="auth-shell__card error-page__card">
            <div class="auth-shell__brand">
                <a href="{% url 'home:landing' %}" class="auth-shell__logo-link" aria-label="{{ ui.home_aria }}">
                    {% include 'auth/includes/geotrak_logo.html' %}
                </a>
                <p class="error-page__code" aria-hidden="true">{{ error_status }}</p>
                <h1 class="auth-shell__title">{{ error_title }}</h1>
                <p class="auth-shell__subtitle">{{ error_body }}</p>
            </div>

            <div class="error-page__actions">
                <a href="{% url 'home:landing' %}" class="auth-primary-btn">{{ ui.error_go_home }}</a>
                <a href="{% url 'auth:login' %}" class="auth-secondary-btn">{{ ui.error_go_sign_in }}</a>
            </div>
        </div>
    </div>
</body>
</html>
