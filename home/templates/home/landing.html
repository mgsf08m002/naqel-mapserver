{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KSA Map Editing Module - Landing</title>
    <meta property="og:description" content="KSA Map Editing Module - Interactive mapping solution." />
    
    <!-- MapLibre GL CSS -->
    <link rel='stylesheet' href='https://unpkg.com/maplibre-gl@5.14.0/dist/maplibre-gl.css' />
    
    <!-- MapLibre GL JS -->
    <script src='https://unpkg.com/maplibre-gl@5.14.0/dist/maplibre-gl.js'></script>
    
    <!-- TerraDraw CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@watergis/maplibre-gl-terradraw@1.0.1/dist/maplibre-gl-terradraw.css"/>
    
    <!-- TerraDraw JS -->
    <script src="https://cdn.jsdelivr.net/npm/@watergis/maplibre-gl-terradraw@1.0.1/dist/maplibre-gl-terradraw.umd.js"></script>
    
    <!-- Tailwind CSS -->
    <link href="{% static 'css/output.css' %}" rel="stylesheet">
</head>
<body class="m-0 p-0 bg-white min-h-screen font-sans flex flex-col h-screen overflow-hidden">
    <!-- Header -->
    <header class="bg-white/95 backdrop-blur-sm border-b border-gray-200/50 sticky top-0 z-20 shadow-sm flex-shrink-0">
        <div class="flex items-center justify-between px-6 py-3 max-w-[1920px] mx-auto">
            <!-- Left Section: Logo -->
            <div class="flex items-center flex-1 justify-start">
                <a href="/" class="inline-flex items-center transition-transform duration-200 hover:scale-105 focus:outline-none focus:ring-2 focus:ring-gray-200 focus:ring-offset-2 rounded-lg p-1">
                    <img src="{% static 'auth/images/logo-dark.png' %}" alt="Naqel Logo" class="h-9 w-auto max-w-[160px] object-contain">
                </a>
            </div>
            
            <!-- Center Section: Edit Button -->
            <div class="flex items-center flex-1 justify-center">
                <a 
                    href="{% url 'auth:login' %}" 
                    class="inline-flex items-center gap-2 px-4 py-2 text-sm font-semibold text-black border border-black rounded-full bg-white hover:bg-gray-100 active:bg-gray-200 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-black focus:ring-offset-2 shadow-sm"
                >
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                    </svg>
                    <span>Edit</span>
                </a>
            </div>
            
            <!-- Right Section: Login Button -->
            <div class="flex items-center flex-1 justify-end">
                <a href="{% url 'auth:login' %}" class="inline-flex items-center px-6 py-2.5 text-sm font-semibold text-white bg-black rounded-full hover:bg-gray-900 active:bg-gray-800 transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-black focus:ring-offset-2 shadow-md hover:shadow-lg">
                    Login
                </a>
            </div>
        </div>
    </header>

    <!-- Map Container -->
    <div class="flex-1 relative overflow-hidden min-h-0">
        <div
            id="map"
            class="w-full h-full"
            data-is-authenticated="false"
            {% if maptiler_api_key %}data-maptiler-api-key="{{ maptiler_api_key }}"{% endif %}
            {% if riyadh_roads_tile_url %}data-riyadh-roads-tile-url="{{ riyadh_roads_tile_url }}"{% endif %}
        ></div>
        <div
            id="coordinatesDisplay"
            class="hidden absolute bottom-4 left-1/2 -translate-x-1/2 z-40 pointer-events-none select-none rounded-full border border-gray-200 bg-white/85 backdrop-blur px-3 py-1.5 text-xs font-medium text-gray-700 shadow-sm"
            aria-label="Current longitude and latitude"
        ></div>

        {% include 'mapping/includes/basemap_gallery.html' %}
    </div>

    <!-- Map JavaScript -->
    <script src="{% static 'mapping/js/map-line-selection.js' %}"></script>
    <script src="{% static 'mapping/js/map.js' %}"></script>
    <script src="{% static 'mapping/js/public-approved-lines.js' %}"></script>
</body>
</html>
