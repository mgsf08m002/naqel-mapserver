<div class="permissions-perm-list">
    {% if role == 'manager' %}
    <label class="permissions-perm-row">
        <input class="permissions-check-input" type="checkbox" name="can_access_dashboard" id="can_access_dashboard"{% if profile.can_access_dashboard %} checked{% endif %}>
        <span class="permissions-check" aria-hidden="true">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
        </span>
        <span class="permissions-perm-icon" aria-hidden="true">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 5a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1V5zm10 0a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1V5zM4 15a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1v-4zm10 0a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"></path></svg>
        </span>
        <span class="permissions-perm-copy">
            <strong>Access Dashboard</strong>
            <span>Allow the manager to view and access the dashboard</span>
        </span>
        <span class="permissions-perm-chevron" aria-hidden="true">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        </span>
    </label>
    {% endif %}

    <label class="permissions-perm-row">
        <input class="permissions-check-input" type="checkbox" name="can_access_security" id="can_access_security"{% if profile.can_access_security %} checked{% endif %}>
        <span class="permissions-check" aria-hidden="true">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
        </span>
        <span class="permissions-perm-icon" aria-hidden="true">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
        </span>
        <span class="permissions-perm-copy">
            <strong>Access Security Page</strong>
            <span>Allow the {{ role }} to access the security settings page</span>
        </span>
        <span class="permissions-perm-chevron" aria-hidden="true">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        </span>
    </label>

    <label class="permissions-perm-row">
        <input class="permissions-check-input" type="checkbox" name="can_access_account_information" id="can_access_account_information"{% if profile.can_access_account_information %} checked{% endif %}>
        <span class="permissions-check" aria-hidden="true">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
        </span>
        <span class="permissions-perm-icon" aria-hidden="true">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        </span>
        <span class="permissions-perm-copy">
            <strong>Access Account Information</strong>
            <span>Allow the {{ role }} to access and update account information</span>
        </span>
        <span class="permissions-perm-chevron" aria-hidden="true">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        </span>
    </label>

    <label class="permissions-perm-row">
        <input class="permissions-check-input" type="checkbox" name="can_access_layer_uploader" id="can_access_layer_uploader"{% if profile.can_access_layer_uploader %} checked{% endif %}>
        <span class="permissions-check" aria-hidden="true">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
        </span>
        <span class="permissions-perm-icon" aria-hidden="true">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 2L2 7l10 5 10-5-10-5zM2 12l10 5 10-5M2 17l10 5 10-5"></path></svg>
        </span>
        <span class="permissions-perm-copy">
            <strong>Access Layer Uploader</strong>
            <span>Allow the {{ role }} to upload and validate GIS layers</span>
        </span>
        <span class="permissions-perm-chevron" aria-hidden="true">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        </span>
    </label>

    <label class="permissions-perm-row">
        <input class="permissions-check-input" type="checkbox" name="can_access_my_edits" id="can_access_my_edits"{% if profile.can_access_my_edits %} checked{% endif %}>
        <span class="permissions-check" aria-hidden="true">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
        </span>
        <span class="permissions-perm-icon" aria-hidden="true">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
        </span>
        <span class="permissions-perm-copy">
            <strong>Access My Edits</strong>
            <span>Allow the {{ role }} to view their road edit submission history</span>
        </span>
        <span class="permissions-perm-chevron" aria-hidden="true">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        </span>
    </label>
</div>
