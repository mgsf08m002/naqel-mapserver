# GeoTrak Maps app container.
#
# PostgreSQL/PostGIS, Martin and Nginx live in the shared stack ../geo-infra.
# Start it first (it creates the external `geo_shared` network):
#   cd ../geo-infra && docker compose up -d
# The app is reachable only through Nginx on :8000 (GEOTRAK_HTTP_PORT). Nginx resolves this
# container by its network alias `geotrak_web`.
services:
  geotrak_maps:
    build: .
    container_name: GeoTrak_Maps
    restart: unless-stopped
    volumes:
      - .:/app
    command: ["/usr/local/bin/geotrak_entrypoint.sh"]
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    networks:
      geo_shared:
        aliases:
          - geotrak_web

networks:
  geo_shared:
    external: true
