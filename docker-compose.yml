# GeoTrak Maps — local development (bind-mounts source for live edits).
#
# PostgreSQL/PostGIS, Martin and Nginx live in the shared stack ../geo_infra.
# Start it first (creates the external `geo_shared` network):
#   cd ../geo_infra && docker compose up -d
#
# Public URL: http://localhost:8000 (via shared Nginx).
# Production: use docker-compose.prod.yml instead.
services:
  geotrak_maps:
    build: .
    container_name: GeoTrak_Maps
    restart: unless-stopped
    volumes:
      - .:/app
      - media_data:/app/media
    command: ["/usr/local/bin/geotrak_entrypoint.sh"]
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    networks:
      geo_shared:
        aliases:
          - geotrak_web

volumes:
  media_data:

networks:
  geo_shared:
    external: true
